# Auto-log every push to main into the feature_releases table (Experiments tab).
#
# Each pushed commit becomes one row in the release log via the secret-guarded
# log_feature_release() RPC (see supabase/migrations/20260708_feature_releases.sql).
# The admin can rename/annotate/delete entries from the Experiments tab.
#
# Setup (one-time): add one repository secret named RELEASE_LOG_SECRET. Its value
# must match the release_log_secret row in the app_secrets table. Without it,
# this workflow skips silently — it never fails a deploy.
#
# The apikey below is the PUBLIC Supabase anon key, the same kind of key the
# website uses in the browser. It is not the private service-role key; the real
# protection is RELEASE_LOG_SECRET.

name: Log release

on:
  push:
    branches: [main]

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Log pushed commits to the release log
        env:
          RELEASE_LOG_SECRET: ${{ secrets.RELEASE_LOG_SECRET }}
          COMMITS: ${{ toJson(github.event.commits) }}
          SUPABASE_URL: https://txcmismkdttgsyhbnexf.supabase.co
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4Y21pc21rZHR0Z3N5aGJuZXhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMzEyMzksImV4cCI6MjA5MDkwNzIzOX0.0GTg30cJz28QiTzadCjCAAxa8ZPRkV5EptNXNMjTRI0 # nosecret
        run: |
          if [ -z "$RELEASE_LOG_SECRET" ]; then
            echo "RELEASE_LOG_SECRET repo secret not set — skipping release logging."
            exit 0
          fi
          echo "$COMMITS" | jq -c '.[]' | while read -r c; do
            title=$(echo "$c" | jq -r '.message | split("\n")[0]')
            hash=$(echo "$c" | jq -r '.id[0:7]')
            body=$(jq -n --arg s "$RELEASE_LOG_SECRET" --arg t "$title" --arg h "$hash" \
              '{p_secret: $s, p_title: $t, p_commit: $h}')
            if curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/log_feature_release" \
                -H "apikey: $ANON_KEY" \
                -H "Authorization: Bearer $ANON_KEY" \
                -H "Content-Type: application/json" \
                -d "$body" > /dev/null; then
              echo "logged $hash — $title"
            else
              echo "::warning::failed to log $hash — $title"
            fi
          done
