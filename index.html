<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>chapter அ</title>
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="chapter அ admin" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Two installable apps share this single-page site: the admin PWA
      // (default, /manifest.json → starts at /admin) and the creators PWA on
      // /creator. There is deliberately NO static <link rel="manifest"> above:
      // Safari fetches the manifest the moment it parses that tag, so editing
      // its href afterwards is too late — /creator kept installing the admin
      // app (start_url /admin) under the creator icon. Decide the identity
      // first, then inject the matching manifest link.
      (function () {
        var isCreator = location.pathname.indexOf('/creator') === 0;
        var m = document.createElement('link');
        m.rel = 'manifest';
        m.href = isCreator ? '/creator-manifest.json' : '/manifest.json';
        document.head.appendChild(m);
        if (isCreator) {
          document.querySelector('link[rel="apple-touch-icon"]').href = '/apple-touch-icon-creator.png';
          document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'creators';
        }
      })();
    </script>
    <!-- Open Graph / social share preview (IG, WhatsApp, FB, LinkedIn). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chaptera.in/" />
    <meta property="og:title" content="plans we dream — by chapter அ" />
    <meta property="og:image" content="https://chaptera.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter card (also used as a fallback by some platforms). -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="plans we dream — by chapter அ" />
    <meta name="twitter:image" content="https://chaptera.in/og-image.jpg" />
    <!-- Preload the UPI logo so the bill-page payment-method icons paint
         instantly. Without this, the <img> fetch is kicked off only when
         React mounts the bill row, costing one network round-trip. -->
    <link rel="preload" as="image" href="/upi-logo.png" />
    <script>
      // Capture beforeinstallprompt before React mounts so it's never missed.
      // React reads it from window.__deferredInstallPrompt.
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });
    </script>
    <!-- Contentsquare: configure privacy before tracker loads. Hash IPs and
         disable advertising signals so session replays + analytics events
         carry less identifying data. Forms also use data-cs-mask="true" on
         phone/name fields (added in component files) so input values are
         scrubbed from replays. -->
    <script>
      window._uxa = window._uxa || [];
      window._uxa.push(['setPrivacyAttributes', { ipHashing: true, denyAdvertising: true }]);
    </script>
    <script src="https://t.contentsquare.net/uxa/02bde574cbdd5.js" async></script>
    <!-- Google Analytics: anonymize_ip strips the last IP octet; ad_*_signals
         off prevents GA from sharing data with Google Ads. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3MLZ9S6M2S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // Instagram/Facebook in-app browsers used to be skipped here: the
      // full-screen "open in external browser" wall made their landing a
      // duplicate of the external-browser one that followed. The wall is gone
      // from every customer route (see src/inAppBrowser.ts) — they now browse
      // and pay in place, and since practically all our traffic arrives from
      // Instagram, dropping them left GA blind to the real funnel.
      gtag('js', new Date());
      gtag('config', 'G-3MLZ9S6M2S', {
        anonymize_ip: true,
        allow_google_signals: false,
        allow_ad_personalization_signals: false,
      });
    </script>
    <style>
      @keyframes ca-glow {
        0%, 100% { opacity: 0.15; transform: scale(1); }
        50%       { opacity: 0.45; transform: scale(1.18); }
      }
      #html-preloader {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: 9999;
        background: #ffffff;
        display: -webkit-box;
        display: -webkit-flex;
        display: flex;
        -webkit-box-align: center;
        -webkit-align-items: center;
        align-items: center;
        -webkit-box-pack: center;
        -webkit-justify-content: center;
        justify-content: center;
      }
      #html-preloader-inner {
        position: relative;
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        -webkit-flex-shrink: 0;
      }
      #html-preloader-glow {
        position: absolute;
        top: -10px; right: -10px; bottom: -10px; left: -10px;
        border-radius: 22px;
        background: radial-gradient(circle, rgba(255,200,0,0.4) 0%, transparent 70%);
        filter: blur(8px);
        -webkit-filter: blur(8px);
        animation: ca-glow 2s ease-in-out infinite;
        -webkit-animation: ca-glow 2s ease-in-out infinite;
      }
      #html-preloader-box {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #000000;
        box-shadow: 0 4px 24px rgba(0,0,0,0.18);
        overflow: hidden;
        padding: 6px;
        box-sizing: border-box;
      }
      #html-preloader-logo {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        transform: translateY(2px) scale(1.02);
      }
    </style>
  </head>
  <body>
    <!-- Pre-loader: uses the same gold-on-black chapter அ mark as the lifestyle loader.
         Removed via double-rAF in main.tsx after React's first paint. -->
    <div id="html-preloader">
      <div id="html-preloader-inner">
        <div id="html-preloader-glow"></div>
        <div id="html-preloader-box">
          <img id="html-preloader-logo" src="/src/assets/chat-profile.jpg" alt="" aria-hidden="true" />
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
